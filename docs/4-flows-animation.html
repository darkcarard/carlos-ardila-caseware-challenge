<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flujos del Fan-Out</title>
<style>
:root{
  --bg:#f5f6fa;--surface:#ffffff;--surface2:#eef1f7;--text:#121726;--muted:#5a6478;--line:#d6dbe7;--edge:#a6afc4;
  --accent:#3563f0;--accent-soft:#e5ecff;--green:#0f9d68;--green-soft:#e0f5ec;--amber:#c97f00;--amber-soft:#fff2d8;
  --red:#dc3f34;--red-soft:#fde6e4;--violet:#7547f5;--violet-soft:#eee7ff;--zone-g:#eef2ff;--zone-r:#ecf8f2;
  --node:#ffffff;--pkt-bg:#ffffff;--shadow:0 1px 2px rgba(16,24,40,.05),0 10px 30px rgba(16,24,40,.07);
  --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0d16;--surface:#111625;--surface2:#171e31;--text:#e6e9f2;--muted:#959fb6;--line:#262f47;--edge:#4a5574;
  --accent:#7193ff;--accent-soft:rgba(113,147,255,.15);--green:#34d399;--green-soft:rgba(52,211,153,.13);--amber:#fbbf24;--amber-soft:rgba(251,191,36,.13);
  --red:#f87171;--red-soft:rgba(248,113,113,.14);--violet:#a78bfa;--violet-soft:rgba(167,139,250,.16);--zone-g:rgba(113,147,255,.06);--zone-r:rgba(52,211,153,.05);
  --node:#141a2b;--pkt-bg:#0e1320;--shadow:0 0 0 1px rgba(255,255,255,.02);
}}
:root[data-theme="dark"]{
  --bg:#0a0d16;--surface:#111625;--surface2:#171e31;--text:#e6e9f2;--muted:#959fb6;--line:#262f47;--edge:#4a5574;
  --accent:#7193ff;--accent-soft:rgba(113,147,255,.15);--green:#34d399;--green-soft:rgba(52,211,153,.13);--amber:#fbbf24;--amber-soft:rgba(251,191,36,.13);
  --red:#f87171;--red-soft:rgba(248,113,113,.14);--violet:#a78bfa;--violet-soft:rgba(167,139,250,.16);--zone-g:rgba(113,147,255,.06);--zone-r:rgba(52,211,153,.05);
  --node:#141a2b;--pkt-bg:#0e1320;--shadow:0 0 0 1px rgba(255,255,255,.02);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
code,.mono{font-family:var(--mono);font-size:.92em}
code{background:var(--surface2);padding:1px 5px;border-radius:5px}
button{font:inherit;color:inherit}
html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex:none}
header .brand{flex:none}
header h1{font-size:15px;margin:0;letter-spacing:-.01em;white-space:nowrap}
header p{margin:0;color:var(--muted);font-size:12px;white-space:nowrap}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:34px;min-width:34px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.icon-btn:hover{border-color:var(--accent)}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin}
nav button{display:flex;gap:8px;align-items:center;white-space:nowrap;border:1px solid transparent;background:transparent;border-radius:10px;padding:7px 11px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);flex:none}
nav button:hover{background:var(--surface2);color:var(--text)}
nav button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
nav .n{width:20px;height:20px;border-radius:6px;background:var(--surface2);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted)}
nav button.on .n{background:var(--accent);color:#fff}
.app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(320px,30vw,440px);gap:14px;padding:14px 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.stage-card{overflow:hidden;display:flex;flex-direction:column;min-height:0}
.stage-head{display:flex;justify-content:space-between;align-items:center;gap:6px 14px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex:none}
.stage-head h2{margin:0;font-size:15px}
.stage-head p{margin:1px 0 0;color:var(--muted);font-size:12.5px}
.legend{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.stage-wrap{flex:1;min-height:180px;position:relative}
svg#stage{position:absolute;inset:6px 8px;width:calc(100% - 16px);height:calc(100% - 12px);display:block}
.controls{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap;flex:none}
.side{display:flex;flex-direction:column;gap:14px;min-height:0}
.side .narr{flex:none;max-height:55%;overflow:auto}
.side .insp{flex:1;min-height:0;overflow:auto}
.controls .play{background:var(--accent);color:#fff;border-color:var(--accent);min-width:90px}
.dots{display:flex;gap:6px;flex:1;min-width:120px;flex-wrap:wrap;justify-content:center}
.dots button{width:26px;height:6px;border-radius:4px;border:0;background:var(--line);cursor:pointer;padding:0}
.dots button.done{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.dots button.on{background:var(--accent)}
select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;height:34px;padding:0 8px}
.narr{padding:16px 18px}
.narr .k{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.narr h3{margin:4px 0 8px;font-size:18px;letter-spacing:-.01em}
.narr .txt{color:var(--text)}
.narr .txt p{margin:0 0 8px}
.insp{padding:16px 18px}
.insp-h{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px}
.fade-in{animation:fi .35s ease}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
#widget{border-top:1px solid var(--line);flex:none;max-height:48%;overflow:auto}
#widget[hidden]{display:none}

/* svg */
.zone{stroke:var(--line);stroke-dasharray:6 6;stroke-width:1.2}
.zone.g{fill:var(--zone-g)} .zone.r{fill:var(--zone-r)} .zone.n{fill:transparent}
.zone-label{fill:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:.06em}
.boundary{stroke:var(--red);stroke-width:1.5;stroke-dasharray:3 6;opacity:.7}
.boundary-label{fill:var(--red);font-size:11px;font-weight:600}
.edge{stroke:var(--edge);stroke-width:1.6;fill:none}
.edge.dash{stroke-dasharray:5 6;opacity:.7}
.edge-label{fill:var(--muted);font-size:10.5px}
#arr path{fill:var(--edge)}
.node .box{fill:var(--node);stroke:var(--line);stroke-width:1.5;transition:fill .4s,stroke .4s,opacity .4s}
.node{transition:opacity .45s}
.node .t{fill:var(--text);font-size:13px;font-weight:650;text-anchor:middle}
.node .s{fill:var(--muted);font-size:11px;text-anchor:middle}
.node .tag rect{fill:var(--accent)} .node .tag text{fill:#fff;font-size:10.5px;font-weight:700;text-anchor:middle}
.node .tag{transition:opacity .3s}
.node.hidden{opacity:0}
.node.dim{opacity:.38}
.node.active .box,.node.base .box{fill:var(--accent-soft);stroke:var(--accent)}
.node.ok .box{fill:var(--green-soft);stroke:var(--green)}   .node.ok .tag rect{fill:var(--green)}
.node.warn .box,.node.declined .box{fill:var(--amber-soft);stroke:var(--amber)} .node.warn .tag rect,.node.declined .tag rect{fill:var(--amber)}
.node.bad .box{fill:var(--red-soft);stroke:var(--red)} .node.bad .tag rect{fill:var(--red)}
.node.pending .box{fill:var(--violet-soft);stroke:var(--violet)} .node.pending .tag rect{fill:var(--violet)}
.node.withdrawn .box{fill:var(--red-soft);stroke:var(--red);stroke-dasharray:5 4} .node.withdrawn .tag rect{fill:var(--red)} .node.withdrawn .t{text-decoration:line-through}
.node.locked .box{fill:var(--surface2);stroke:var(--muted)} .node.locked .tag rect{fill:var(--muted)}
.node.dim .tag rect{fill:var(--muted)}
.node.focus .box{stroke-width:2.6}
.node.focus .body{filter:drop-shadow(0 0 10px color-mix(in srgb,var(--accent) 45%,transparent))}
.node .body{transform-box:fill-box;transform-origin:center}
.node.pulse .body{animation:pulse .5s ease}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
.pkt circle{stroke:var(--pkt-bg);stroke-width:2}
.pkt .pill{fill:var(--pkt-bg);stroke-width:1.3}
.pkt text{font-size:11px;font-family:var(--mono);fill:var(--text)}
.k-evt{--c:var(--accent)} .k-safe{--c:var(--green)} .k-write{--c:var(--violet)} .k-bad{--c:var(--red)} .k-load{--c:var(--amber)}
.pkt circle{fill:var(--c)} .pkt .pill{stroke:var(--c)}
.pkt .halo{fill:var(--c);opacity:.25}

/* inspector widgets */
.kvs{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px}
.kvs .h{background:var(--surface2);padding:7px 12px;font-size:12px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 12px;border-top:1px solid var(--line);font-family:var(--mono);font-size:12.5px}
.kv span{color:var(--muted)}
.kv b{font-weight:600;text-align:right}
.kv.chg{background:var(--violet-soft)}
.kv.chg b{color:var(--violet)}
.cond{border-radius:12px;padding:10px 12px;margin-bottom:10px;border:1px solid;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.cond code{background:transparent;padding:0;font-size:12.5px}
.cond.ok{border-color:var(--green);background:var(--green-soft)} .cond.ok .v{color:var(--green)}
.cond.bad{border-color:var(--red);background:var(--red-soft)} .cond.bad .v{color:var(--red)}
.cond .v{font-weight:700;white-space:nowrap;font-size:12.5px}
.cond small{display:block;color:var(--muted);margin-top:3px}
.note{color:var(--muted);font-size:13px;margin:6px 0 10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:10px}
.stat{background:var(--surface2);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:20px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px;line-height:1.3;display:block}
.stat.hl b{color:var(--green)}
.list{margin:0 0 10px;padding:0;list-style:none}
.list li{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.list li:last-child{border-bottom:0}
.list .i{flex:0 0 18px;font-weight:700}
.list .y{color:var(--green)} .list .x{color:var(--red)} .list .w{color:var(--amber)}
.bar{height:12px;border-radius:8px;background:var(--surface2);overflow:hidden;margin:6px 0 4px;position:relative}
.bar i{display:block;height:100%;border-radius:8px;background:var(--accent);animation:grow 2.2s ease forwards}
.bar i.r{background:var(--red)} .bar i.g{background:var(--green)}
@keyframes grow{from{width:var(--from)}to{width:var(--to)}}
.bar-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;font-family:var(--mono)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.okc{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.chip.badc{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.chip.warnc{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.arrow{color:var(--muted)}
pre.code{margin:0 0 10px;background:var(--surface2);border-radius:12px;padding:10px 12px;font-family:var(--mono);font-size:12px;line-height:1.5;overflow-x:auto;white-space:pre}
pre.code .c{color:var(--muted)} pre.code .k{color:var(--violet)} pre.code .g{color:var(--green)}
.diff li{font-family:var(--mono);font-size:12px}
.lbl{font-family:system-ui,sans-serif;font-size:11px;border-radius:6px;padding:0 6px;background:var(--amber-soft);color:var(--amber);font-weight:700;margin-left:auto;white-space:nowrap}
.lbl.n{background:var(--accent-soft);color:var(--accent)}

/* capacity sim */
.cap{padding:10px 16px 12px}
.cap-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start}
.cap-grid{display:grid;grid-template-columns:repeat(10,11px);gap:3px}
.cap-grid div{width:11px;height:11px;border-radius:3px;background:var(--surface2);transition:background .15s}
.cap-firms{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))!important;gap:6px!important}
.firm{padding:5px 8px!important;font-size:11px!important}
.cap-ctl{margin-top:8px!important}
.cap-ctl .icon-btn{height:28px;font-size:12px}
.inv{margin:0 0 8px!important}
.cap-h{margin-bottom:8px!important}
.cap-h h3{font-size:13px!important}
.cap-grid div.w{background:var(--amber)} .cap-grid div.s{background:var(--accent)} .cap-grid div.n{background:var(--green)}
.cap-firms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.firm{background:var(--surface2);border-radius:10px;padding:8px 10px;font-size:12px}
.firm .top{display:flex;justify-content:space-between;font-family:var(--mono)}
.firm .bar{height:6px;margin:5px 0 3px}
.firm .bar i{animation:none;transition:width .2s}
.firm.whale{grid-column:1/-1}
.firm.whale .bar i{background:var(--amber)} .firm.newf .bar i{background:var(--green)}
.firm .cap10{display:flex;gap:2px;margin-top:4px}
.firm .cap10 span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.firm .cap10 span.on{background:var(--text)}
.cap-ctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.cap-ctl .kill.on{background:var(--red);border-color:var(--red);color:#fff}
.inv{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.cap-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cap-h h3{margin:0;font-size:15px}
.cap-h small{color:var(--muted)}

@media (max-width:900px){
  body{overflow:auto;display:block}
  header{flex-wrap:wrap}
  nav{flex-basis:100%;order:3}
  .app{grid-template-columns:minmax(0,1fr)}
  .stage-wrap{overflow-x:auto;min-height:0}
  svg#stage{position:static;width:100%;min-width:640px;height:auto;margin:6px 0}
  .side .narr{max-height:none}
  #widget{max-height:none}
  .cap-top{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>Fan-out · flujos animados</h1>
    <p>basado en docs/1-design-document.md</p>
  </div>
  <nav id="nav" aria-label="Flujos" role="tablist"></nav>
  <button class="icon-btn" id="theme" title="Cambiar tema">◐</button>
</header>

<div class="app">
    <section class="card stage-card">
      <div class="stage-head">
        <div><h2 id="sTitle"></h2><p id="sSub"></p></div>
        <div class="legend">
          <span><i style="background:var(--accent)"></i>evento / lectura</span>
          <span><i style="background:var(--green)"></i>sin IDs (cruza planos)</span>
          <span><i style="background:var(--violet)"></i>escritura condicional</span>
          <span><i style="background:var(--red)"></i>conflicto / fallo</span>
          <span><i style="background:var(--amber)"></i>carga downstream ~1 min</span>
        </div>
      </div>
      <div class="stage-wrap"><svg id="stage" viewBox="0 0 1000 540" role="img" aria-label="Diagrama animado del flujo"></svg></div>
      <div id="widget" hidden></div>
      <div class="controls">
        <button class="icon-btn" id="prev" title="Paso anterior (←)">◀</button>
        <button class="icon-btn play" id="play" title="Reproducir / pausar (espacio)">▶ Play</button>
        <button class="icon-btn" id="next" title="Paso siguiente (→)">▶▶</button>
        <button class="icon-btn" id="replay" title="Repetir paso">↺</button>
        <div class="dots" id="dots"></div>
        <select id="speed" title="Velocidad">
          <option value="0.6">0.6×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option>
        </select>
      </div>
    </section>

    <aside class="side">
      <section class="card narr">
        <div class="k" id="nStep"></div>
        <h3 id="nTitle"></h3>
        <div class="txt" id="nText"></div>
      </section>
      <section class="card insp">
        <div class="insp-h">Inspector</div>
        <div id="panel"></div>
      </section>
    </aside>
</div>

<script>
/* ---------- helpers for inspector panels ---------- */
const row=(title,o,ch=[])=>`<div class="kvs"><div class="h"><span>${title}</span></div>${Object.entries(o).map(([k,v])=>`<div class="kv ${ch.includes(k)?'chg':''}"><span>${k}</span><b>${v}</b></div>`).join('')}</div>`;
const cond=(c,ok,small='')=>`<div class="cond ${ok?'ok':'bad'}"><div><code>${c}</code>${small?`<small>${small}</small>`:''}</div><span class="v">${ok?'✓ pasa':'✗ falla'}</span></div>`;
const note=t=>`<p class="note">${t}</p>`;
const stats=a=>`<div class="stats">${a.map(([b,s,h])=>`<div class="stat ${h?'hl':''}"><b>${b}</b><span>${s}</span></div>`).join('')}</div>`;
const list=a=>`<ul class="list">${a.map(([i,t])=>`<li><span class="i ${i==='✓'?'y':i==='✗'?'x':'w'}">${i}</span><span>${t}</span></li>`).join('')}</ul>`;
const bar=(from,to,l,r='',cls='')=>`<div class="bar-l"><span>${l}</span><span>${r}</span></div><div class="bar"><i class="${cls}" style="--from:${from};--to:${to};width:${to}"></i></div>`;
const chips=a=>`<div class="chips">${a.map(([t,c])=>c==='→'?`<span class="arrow">→</span>`:`<span class="chip ${c||''}">${t}</span>`).join('')}</div>`;
const code=t=>`<pre class="code">${t}</pre>`;

/* ---------- scenes ---------- */
const SCENES=[
/* 1 ─────────────────────────────── */
{
  id:'publish', nav:'Publish fan-out', blurb:'Del publish al badge: 0 cargas downstream',
  title:'Publish fan-out (solo registry)', sub:'Un publish nunca carga un engagement: solo toca el registry regional y la proyección del grafo.',
  zones:[{x:20,y:20,w:960,h:135,l:'PLANO GLOBAL · solo datos de plantilla, cero firm / engagement IDs',k:'g'},
         {x:20,y:195,w:960,h:330,l:'PLANO REGIONAL · eu-central-1 · los IDs nunca salen de aquí',k:'r'}],
  lines:[{x1:20,y1:175,x2:980,y2:175,l:'frontera de residencia · cuentas + IAM'}],
  nodes:[
    {id:'TDB',x:150,y:95,l:'Template DB',sub:'hooks publish / withdraw'},
    {id:'BUS',x:500,y:95,l:'Event bus global',sub:'graph_seq por producto'},
    {id:'SUM',x:830,y:95,l:'Diff + Summary',sub:'S3 Object Lock'},
    {id:'G',x:150,y:285,l:'Version graph',sub:'proyección · epoch 8'},
    {id:'P',x:500,y:258,l:'Chunk planner',sub:'GSI-2 por shard'},
    {id:'Q',x:150,y:450,l:'SQS + DLQ',sub:'1 mensaje / chunk'},
    {id:'W',x:500,y:375,l:'Fan-out worker',sub:'circuit breaker'},
    {id:'R',x:830,y:285,l:'Registry DynamoDB',sub:'conditional writes'},
    {id:'D',x:830,y:450,l:'Dashboard / API',sub:'p99 < 500 ms'},
    {id:'ENG',x:500,y:482,l:'Engagement loader',sub:'~1 min / archivo',s:'dim'},
  ],
  edges:[['TDB','BUS'],['BUS','SUM'],['BUS','G'],['G','P'],['P','R'],['P','Q'],['Q','W'],['G','W'],['W','R'],['W','SUM'],['R','D'],['W','ENG',{dash:1}]],
  steps:[
    {k:'Origen',t:'El equipo de contenido publica v7',hi:['TDB'],
     x:`<p>El hook <code>published</code> sale por el outbox del Template DB con un <code>graph_seq</code> monotónico por producto, para que cada región aplique los cambios del grafo <b>en orden</b>.</p><p>El evento solo describe la plantilla: no sabe nada de firmas ni engagements.</p>`,
     p:[{f:'TDB',t:'BUS',l:'published v7 · graph_seq 42',k:'evt'}],

/* ---------- engine ---------- */
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const stage=$('stage');
const cur={scene:0,step:0,playing:false,speed:1};
let SC, nodeEls={}, nodeDefs={}, layers={}, timers=[], token=0, widget=null;

function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function later(fn,ms){timers.push(setTimeout(fn,ms))}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}

function clipPts(a,b){
  const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len;
  const ta=Math.min(a.w/2/Math.abs(ux||1e-9),a.h/2/Math.abs(uy||1e-9));
  const tb=Math.min(b.w/2/Math.abs(ux||1e-9),b.h/2/Math.abs(uy||1e-9));
  return [{x:a.x+ux*(ta+3),y:a.y+uy*(ta+3)},{x:b.x-ux*(tb+6),y:b.y-uy*(tb+6)}];
}

function buildNav(){
  $('nav').innerHTML=SCENES.map((s,i)=>`<button role="tab" data-i="${i}" title="${s.blurb}"><span class="n">${i+1}</span>${s.nav}</button>`).join('');
  $('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{mountScene(+b.dataset.i)});
}

function mountScene(i){
  clearTimers();token++;
  if(widget){widget.destroy();widget=null}
  cur.scene=i;cur.step=0;SC=SCENES[i];
  const vh=SC.vh||540;stage.setAttribute('viewBox',`0 0 1000 ${vh}`);
  stage.innerHTML='';nodeEls={};nodeDefs={};
  const defs=el('defs',{},stage);
  const m=el('marker',{id:'arr',viewBox:'0 0 10 10',refX:'8',refY:'5',markerWidth:'7',markerHeight:'7',orient:'auto-start-reverse'},defs);
  el('path',{d:'M0,0 L10,5 L0,10 z'},m);
  layers={z:el('g',{},stage),e:el('g',{},stage),n:el('g',{},stage),p:el('g',{},stage)};
  (SC.zones||[]).forEach(z=>{el('rect',{x:z.x,y:z.y,width:z.w,height:z.h,rx:16,class:'zone '+(z.k||'n')},layers.z);const t=el('text',{x:z.x+16,y:z.y+22,class:'zone-label'},layers.z);t.textContent=z.l});
  (SC.lines||[]).forEach(l=>{el('line',{x1:l.x1,y1:l.y1,x2:l.x2,y2:l.y2,class:'boundary'},layers.z);const t=el('text',{x:l.x2-8,y:l.y1-6,class:'boundary-label','text-anchor':'end'},layers.z);t.textContent=l.l});
  const W=SC.nw||170,H=SC.nh||58;
  SC.nodes.forEach(n=>{nodeDefs[n.id]={...n,w:n.w||W,h:n.h||H}});
  (SC.edges||[]).forEach(([a,b,o])=>{const[p,q]=clipPts(nodeDefs[a],nodeDefs[b]);el('path',{d:`M${p.x},${p.y} L${q.x},${q.y}`,class:'edge'+(o&&o.dash?' dash':''),'marker-end':'url(#arr)'},layers.e)});
  SC.nodes.forEach(n=>{
    const d=nodeDefs[n.id];
    const g=el('g',{transform:`translate(${d.x},${d.y})`,class:'node'},layers.n);
    const body=el('g',{class:'body'},g);
    el('rect',{class:'box',x:-d.w/2,y:-d.h/2,width:d.w,height:d.h,rx:12},body);
    const t=el('text',{class:'t',y:d.sub?-3:5},body);t.textContent=d.l;
    const s=el('text',{class:'s',y:15},body);s.textContent=d.sub||'';
    const tag=el('g',{class:'tag',transform:`translate(0,${-d.h/2})`},g);
    const tr=el('rect',{y:-10,height:20,rx:10},tag);const tt=el('text',{y:4},tag);
    nodeEls[n.id]={g,t,s,tag,tr,tt,d};
  });
  const wh=$('widget');
  if(SC.widget){wh.hidden=false;widget=SC.widget(wh)}else{wh.hidden=true;wh.innerHTML=''}
  $('sTitle').textContent=SC.title;$('sSub').textContent=SC.sub;
  document.querySelectorAll('#nav button').forEach((b,j)=>{b.classList.toggle('on',j===i);b.setAttribute('aria-selected',j===i);if(j===i)b.scrollIntoView({block:'nearest',inline:'nearest'})});
  $('dots').innerHTML=SC.steps.map((_,j)=>`<button data-j="${j}" title="Paso ${j+1}"></button>`).join('');
  $('dots').querySelectorAll('button').forEach(b=>b.onclick=()=>{cur.step=+b.dataset.j;applyStep()});
  applyStep();
}

function computeState(){
  const st={};
  SC.nodes.forEach(n=>st[n.id]={s:n.s||'idle',sub:n.sub||'',tag:n.tag||''});
  for(let j=0;j<=cur.step;j++){const set=SC.steps[j].set||{};for(const k in set){const v=typeof set[k]==='string'?{s:set[k]}:set[k];Object.assign(st[k],v)}}
  return st;
}

function applyStep(){
  clearTimers();const tok=++token;layers.p.innerHTML='';
  const step=SC.steps[cur.step],st=computeState(),hi=new Set(step.hi||[]);
  for(const id in nodeEls){
    const e=nodeEls[id],s=st[id];
    e.g.setAttribute('class',`node ${s.s}${hi.has(id)&&s.s!=='hidden'?' focus':''}`);
    e.s.textContent=s.sub;e.t.setAttribute('y',s.sub?-3:5);
    e.tt.textContent=s.tag;
    if(s.tag){const w=e.tt.getComputedTextLength()+18;e.tr.setAttribute('x',-w/2);e.tr.setAttribute('width',w);e.tag.style.opacity=1}else e.tag.style.opacity=0;
  }
  $('nStep').textContent=`${step.k} · paso ${cur.step+1} de ${SC.steps.length}`;
  $('nTitle').textContent=step.t;
  const nt=$('nText');nt.innerHTML=step.x;nt.classList.remove('fade-in');void nt.offsetWidth;nt.classList.add('fade-in');
  let pj=cur.step;while(pj>0&&SC.steps[pj].panel===undefined)pj--;
  const pn=$('panel');pn.innerHTML=SC.steps[pj].panel||'';pn.classList.remove('fade-in');void pn.offsetWidth;pn.classList.add('fade-in');
  $('dots').querySelectorAll('button').forEach((b,j)=>{b.className=j===cur.step?'on':j<cur.step?'done':''});
  const sp=cur.speed,dur=1250/sp;let end=0;
  (step.p||[]).forEach(p=>{const d=(p.d||0)/sp;end=Math.max(end,d+dur);later(()=>fly(p,dur,tok),d)});
  if(cur.playing){const words=(step.x||'').replace(/<[^>]+>/g,'').split(/\s+/).length;later(next,Math.max(end+2200/sp,(2600+words*190)/sp))}
}

function fly(p,dur,tok){
  if(tok!==token)return;
  const a=nodeDefs[p.f],b=nodeDefs[p.t];if(!a||!b)return;
  const [s,e]=clipPts(a,b);
  const g=el('g',{class:`pkt k-${p.k||'evt'}`},layers.p);
  const halo=el('circle',{r:12,class:'halo'},g);
  el('circle',{r:6},g);
  const lg=el('g',{},g);
  const pill=el('rect',{class:'pill',height:20,rx:10,y:-32},lg);
  const tx=el('text',{y:-18,'text-anchor':'middle'},lg);tx.textContent=p.l||'';
  const w=tx.getComputedTextLength()+16;pill.setAttribute('x',-w/2);pill.setAttribute('width',w);
  const t0=performance.now();
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  function frame(now){
    if(tok!==token){g.remove();return}
    const t=Math.min(1,(now-t0)/dur),k=ease(t);
    let x=s.x+(e.x-s.x)*k,y=s.y+(e.y-s.y)*k;
    const lx=Math.max(w/2+4,Math.min(1000-w/2-4,x))-x;
    g.setAttribute('transform',`translate(${x},${y})`);lg.setAttribute('transform',`translate(${lx},0)`);
    halo.setAttribute('r',10+4*Math.sin(now/120));
    if(t<1)requestAnimationFrame(frame);
    else{
      const ne=nodeEls[p.t];ne.g.classList.remove('pulse');void ne.g.getBBox();ne.g.classList.add('pulse');
      later(()=>{g.style.transition='opacity .5s';g.style.opacity=0;later(()=>g.remove(),520)},1100/cur.speed);
    }
  }
  requestAnimationFrame(frame);
}

function next(){
  if(cur.step<SC.steps.length-1){cur.step++;applyStep()}
  else if(cur.playing&&cur.scene<SCENES.length-1){mountScene(cur.scene+1)}
  else setPlaying(false);
}
function prev(){if(cur.step>0){cur.step--;applyStep()}else if(cur.scene>0){mountScene(cur.scene-1);cur.step=SC.steps.length-1;applyStep()}}
function setPlaying(v){cur.playing=v;$('play').textContent=v?'❚❚ Pausa':'▶ Play';applyStep()}

$('play').onclick=()=>setPlaying(!cur.playing);
$('next').onclick=()=>{if(cur.step<SC.steps.length-1){cur.step++;applyStep()}else if(cur.scene<SCENES.length-1)mountScene(cur.scene+1)};
$('prev').onclick=prev;
$('replay').onclick=applyStep;
$('speed').onchange=e=>{cur.speed=+e.target.value};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT')return;
  if(e.key==='ArrowRight'){e.preventDefault();$('next').click()}
  else if(e.key==='ArrowLeft'){e.preventDefault();prev()}
  else if(e.key===' '){e.preventDefault();setPlaying(!cur.playing)}
});
$('theme').onclick=()=>{
  const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme=dark?'light':'dark';
};

/* ---------- capacity simulation widget ---------- */
function capacityWidget(host){
  const GLOBAL=100,PER=10;
  host.innerHTML=`<div class="cap">
    <div class="cap-h"><h3>Simulación: 1 firma whale (800) + 10 firmas pequeñas (20 c/u)</h3><small id="capT"></small></div>
    <div class="cap-top">
      <div><div class="cap-grid" id="capGrid"></div><small style="color:var(--muted);display:block;margin-top:6px">100 slots globales · <span style="color:var(--amber)">■</span> whale <span style="color:var(--accent)">■</span> pequeñas <span style="color:var(--green)">■</span> nuevas</small></div>
      <div>
        <div class="inv" id="capInv"></div>
        <div class="cap-firms" id="capFirms"></div>
      </div>
    </div>
    <div class="cap-ctl">
      <button class="icon-btn kill" id="capKill">⏻ Kill switch</button>
      <button class="icon-btn" id="capAdd">＋ Llega una firma pequeña</button>
      <button class="icon-btn" id="capPause">❚❚ Pausar sim</button>
      <button class="icon-btn" id="capReset">↺ Reiniciar</button>
    </div></div>`;
  const grid=host.querySelector('#capGrid');
  const slotEls=Array.from({length:GLOBAL},()=>{const d=document.createElement('div');grid.appendChild(d);return d});
  let firms,slots,tick,rr,killed,paused,maxG,maxF,seed,timer,extra;
  function rnd(){seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff}
  function mk(id,total,kind){return{id,total,pending:total,inflight:0,done:0,kind,finishedAt:null}}
  function reset(){
    firms=[mk('F-whale',800,'w')];for(let i=1;i<=10;i++)firms.push(mk('F-'+String(i).padStart(3,'0'),20,'s'));
    slots=Array(GLOBAL).fill(null);tick=0;rr=0;killed=false;maxG=0;maxF=0;seed=7;extra=0;
    host.querySelector('#capKill').classList.remove('on');host.querySelector('#capKill').textContent='⏻ Kill switch';
    renderFirms(true);render();
  }
  function inflightG(){return slots.filter(Boolean).length}
  function step(){
    tick++;
    slots.forEach((s,i)=>{if(s&&--s.left<=0){s.f.inflight--;s.f.done++;if(!s.f.pending&&!s.f.inflight)s.f.finishedAt=tick;slots[i]=null}});
    if(!killed){
      let progress=true;
      while(progress){
        progress=false;
        for(let k=0;k<firms.length;k++){
          const f=firms[(rr+k)%firms.length];
          if(inflightG()>=GLOBAL)break;
          if(f.pending>0&&f.inflight<PER){            // per-firm first, then global
            const idx=slots.indexOf(null);if(idx<0)break;
            f.pending--;f.inflight++;slots[idx]={f,left:6+Math.floor(rnd()*4)};progress=true;
          }
        }
      }
      rr=(rr+1)%firms.length;
    }
    maxG=Math.max(maxG,inflightG());firms.forEach(f=>maxF=Math.max(maxF,f.inflight));
    render();
  }
  function renderFirms(full){
    const box=host.querySelector('#capFirms');
    if(full||box.children.length!==firms.length){
      box.innerHTML=firms.map(f=>`<div class="firm ${f.kind==='w'?'whale':f.kind==='n'?'newf':''}"><div class="top"><b>${f.id}</b><span></span></div><div class="bar"><i></i></div><div class="cap10">${'<span></span>'.repeat(PER)}</div></div>`).join('');
    }
  }
  function render(){
    renderFirms(false);
    slots.forEach((s,i)=>{slotEls[i].className=s?s.f.kind:''});
    const box=host.querySelector('#capFirms');
    firms.forEach((f,i)=>{
      const c=box.children[i];
      c.querySelector('.top span').textContent=f.finishedAt?`✓ ${(f.finishedAt*8/60).toFixed(1)} min`:`${f.done}/${f.total} · ${f.inflight} en curso`;
      c.querySelector('.bar i').style.width=(f.done/f.total*100)+'%';
      c.querySelectorAll('.cap10 span').forEach((sp,j)=>sp.className=j<f.inflight?'on':'');
    });
    const g=inflightG();
    host.querySelector('#capInv').innerHTML=chips([[`in-flight global ${g}/${GLOBAL}`,g?'on':''],[`máx. global ${maxG} ≤ ${GLOBAL} ${maxG<=GLOBAL?'✓':'✗'}`,maxG<=GLOBAL?'okc':'badc'],[`máx. por firma ${maxF} ≤ ${PER} ${maxF<=PER?'✓':'✗'}`,maxF<=PER?'okc':'badc']].concat(killed?[['KILL SWITCH ACTIVO','badc']]:[]));
    host.querySelector('#capT').textContent=`tiempo simulado ≈ ${(tick*8/60).toFixed(1)} min · cada carga ≈ 1 min`;
  }
  function loop(){timer=setTimeout(()=>{if(!paused)step();loop()},120/cur.speed)}
  host.querySelector('#capKill').onclick=e=>{killed=!killed;e.currentTarget.classList.toggle('on',killed);e.currentTarget.textContent=killed?'⏻ Kill switch (ON)':'⏻ Kill switch';render()};
  host.querySelector('#capAdd').onclick=()=>{extra++;firms.push(mk('F-new'+extra,20,'n'));renderFirms(true);render()};
  host.querySelector('#capPause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'▶ Reanudar sim':'❚❚ Pausar sim'};
  host.querySelector('#capReset').onclick=reset;
  paused=false;reset();loop();
  return{destroy(){clearTimeout(timer)}};
}

buildNav();
mountScene(0);
</script>
